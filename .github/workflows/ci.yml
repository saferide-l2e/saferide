name: SafeRide checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saferide
          POSTGRES_USER: saferide
          POSTGRES_PASSWORD: saferide
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saferide -d saferide"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEBUG: "true"
      DJANGO_SECRET_KEY: "CI-only-not-for-production"
      DATABASE_URL: postgresql://saferide:saferide@localhost:5432/saferide
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check . 
      - run: python manage.py check
      - run: pytest -q
