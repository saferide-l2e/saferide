[project]
name = "saferide"
version = "0.1.0"
description = "SafeRide passenger and driver web application"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
    "dj-database-url>=2.2,<4",
    "python-dotenv>=1.0,<2",
]

# SafeRide project configuration.

[tool.ruff]
# Keep linting deterministic: requirements pin `ruff>=0.9,<1`, and Ruff's
# default rule set has changed across that range. Selecting the rules
# explicitly means CI behaves the same on every supported Ruff version.
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    # Formatted output (long HTML/template strings) is not worth wrapping.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Django's Meta options (indexes/constraints/widgets) and generated migrations
# use mutable class attributes by design; RUF012 is a false positive there.
"**/migrations/*.py" = ["RUF012", "I001", "E501", "UP"]
"**/models.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
